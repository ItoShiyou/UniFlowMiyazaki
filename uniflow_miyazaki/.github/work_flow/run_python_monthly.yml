name: Run Python Script Monthly

on:
  schedule:
    # 毎月1日の午前9時（日本時間）に定期実行
    - cron: '0 9 1 * *'
  workflow_dispatch: # 手動実行ボタンも残す（テスト用）

permissions:
  contents: write

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🚨 実際のPythonスクリプト名に変更してください
      - name: Run Python Script
        run: python scraper/crawl.py

      # スクリプトが生成・更新したデータを自動コミットしてPush
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🚨 更新されるJSONファイルやアセットのパスを指定
          git add assets/syllabus.json
          
          # 変更があった場合のみコミットしてPush（Flutter側のビルドを誘発）
          if ! git diff --cached --quiet; then
            git commit -m "🤖 [Automated] Monthly syllabus data update"
            git push origin main
          else
            echo "データに変更はありませんでした。"
          fi